<svg xmlns="http://www.w3.org/2000/svg" width="620" height="136" viewBox="0 0 620 136" role="img" aria-label="Localization coverage">
<style>
    .bg { fill: #ffffff; }
    .title, .label, .value { font-family: ui-sans-serif, system-ui, sans-serif; fill: #24292f; }
    .title { font-size: 15px; font-weight: 600; }
    .label { font-size: 13px; font-weight: 600; }
    .value { font-size: 12px; }
    .track { fill: #d8dee4; }
    .fill { fill: #2da44e; }
    @media (prefers-color-scheme: dark) {
        .bg { fill: #0d1117; }
        .title, .label, .value { fill: #e6edf3; }
        .track { fill: #30363d; }
        .fill { fill: #3fb950; }
    }
</style>
<rect width="100%" height="100%" rx="6" class="bg"/>
<text x="16" y="26" class="title">Localization coverage</text>
<text x="16" y="68" class="label">en</text>
<rect x="72" y="54" width="420" height="18" rx="4" class="track"/>
<rect x="72" y="54" width="420" height="18" rx="4" class="fill"/>
<text x="604" y="68" text-anchor="end" class="value">100.0% · 430/430</text>
<text x="16" y="100" class="label">de</text>
<rect x="72" y="86" width="420" height="18" rx="4" class="track"/>
<rect x="72" y="86" width="1" height="18" rx="4" class="fill"/>
<text x="604" y="100" text-anchor="end" class="value">0.2% · 1/430</text>
</svg>
