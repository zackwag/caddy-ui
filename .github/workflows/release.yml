name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing git tag to rebuild both images for using the workflow on main (e.g. v1.13). Older releases may gain a previously unpublished component tag. Never touches `latest`.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-info:
    runs-on: ubuntu-latest
    outputs:
      target_ref: ${{ steps.version.outputs.target_ref }}
      version: ${{ steps.version.outputs.version }}
      major_minor: ${{ steps.version.outputs.major_minor }}
    steps:
      - name: Resolve release version
        id: version
        env:
          TARGET_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          VERSION="${TARGET_REF#v}"
          MAJOR_MINOR=$(echo "$VERSION" | cut -d. -f1,2)
          {
            echo "target_ref=$TARGET_REF"
            echo "version=$VERSION"
            echo "major_minor=$MAJOR_MINOR"
          } >> "$GITHUB_OUTPUT"

  docker-backend:
    runs-on: ubuntu-latest
    needs: release-info
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-info.outputs.target_ref }}

      # Older tags and PR branches may still use the pre-migration layout.
      - name: Resolve build context
        id: context
        run: |
          path=./src/backend
          if [ ! -f "$path/Dockerfile" ]; then path=./backend; fi
          test -f "$path/Dockerfile"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: zackwag/caddy-ui-backend
          tags: |
            type=raw,value=${{ needs.release-info.outputs.version }}
            type=raw,value=${{ needs.release-info.outputs.major_minor }},enable=${{ needs.release-info.outputs.version != needs.release-info.outputs.major_minor }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ steps.context.outputs.path }}
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ needs.release-info.outputs.version }}
          cache-from: type=gha,scope=stable-backend
          cache-to: type=gha,scope=stable-backend,mode=max

  docker-frontend:
    runs-on: ubuntu-latest
    needs: release-info
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-info.outputs.target_ref }}

      # Older tags and PR branches may still use the pre-migration layout.
      - name: Resolve build context
        id: context
        run: |
          path=./src/frontend
          if [ ! -f "$path/Dockerfile" ]; then path=./frontend; fi
          test -f "$path/Dockerfile"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: zackwag/caddy-ui-frontend
          tags: |
            type=raw,value=${{ needs.release-info.outputs.version }}
            type=raw,value=${{ needs.release-info.outputs.major_minor }},enable=${{ needs.release-info.outputs.version != needs.release-info.outputs.major_minor }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ steps.context.outputs.path }}
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ needs.release-info.outputs.version }}
          cache-from: type=gha,scope=stable-frontend
          cache-to: type=gha,scope=stable-frontend,mode=max

  dockerhub-docs:
    runs-on: ubuntu-latest
    needs: [docker-backend, docker-frontend]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7

      - name: Update backend description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: zackwag/caddy-ui-backend
          readme-filepath: ./src/backend/DOCKERHUB.md
          short-description: "API backend for caddy/ui — manages Caddy config, health checks, TLS, logs, and notifications"

      - name: Update frontend description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: zackwag/caddy-ui-frontend
          readme-filepath: ./src/frontend/DOCKERHUB.md
          short-description: "Web frontend for caddy/ui — manage your Caddy server from the browser"

  versions:
    runs-on: ubuntu-latest
    needs: [release-info, docker-backend, docker-frontend]
    if: github.event_name == 'push' && always() && !cancelled()
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # Feeds the backend's update check (src/backend/src/updateCheck.js); only
      # images that actually pushed are recorded
      - name: Record pushed images in versions.json
        env:
          BACKEND: ${{ needs.docker-backend.result == 'success' && needs.release-info.outputs.version || '' }}
          FRONTEND: ${{ needs.docker-frontend.result == 'success' && needs.release-info.outputs.version || '' }}
        run: |
          ARGS=()
          if [ -n "$BACKEND" ]; then ARGS+=("backend=$BACKEND"); fi
          if [ -n "$FRONTEND" ]; then ARGS+=("frontend=$FRONTEND"); fi
          if [ ${#ARGS[@]} -eq 0 ]; then
            echo "No images pushed; nothing to record."
            exit 0
          fi
          .github/scripts/publish-versions.sh stable "${ARGS[@]}"

  release-notes:
    runs-on: ubuntu-latest
    needs: [docker-backend, docker-frontend]
    if: github.event_name == 'push'
    steps:
      - name: Append Docker image info to release-please's release notes
        env:
          GH_TOKEN: ${{ github.token }}
          # This job has no checkout, so gh can't infer the repo from git
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          BACKEND_VERSION: ${{ needs.docker-backend.outputs.version }}
          FRONTEND_VERSION: ${{ needs.docker-frontend.outputs.version }}
        run: |
          FOUND=false
          for i in 1 2 3 4 5; do
            if CURRENT=$(gh release view "$RELEASE_TAG" --json body -q .body 2>"$RUNNER_TEMP/release-notes-error"); then
              FOUND=true
              break
            fi
            echo "Release for $RELEASE_TAG not found yet, retrying..."
            sleep 5
          done
          if [ "$FOUND" != "true" ]; then
            echo "::warning::Could not find a release for $RELEASE_TAG to append Docker image info to: $(cat "$RUNNER_TEMP/release-notes-error")"
            exit 0
          fi

          {
            printf '%s\n' "$CURRENT"
            echo ""
            echo "### Docker images"
            echo ""
            echo '```'
            printf 'docker pull zackwag/caddy-ui-backend:%s\n' "$BACKEND_VERSION"
            printf 'docker pull zackwag/caddy-ui-frontend:%s\n' "$FRONTEND_VERSION"
            echo '```'
          } > "$RUNNER_TEMP/release-notes.md"

          gh release edit "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
