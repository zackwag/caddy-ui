name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
      frontend: ${{ steps.diff.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths since last tag
        id: diff
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${{ github.ref_name }}$" | head -1)
          if [ -z "$PREV_TAG" ]; then
            CHANGED=$(git diff --name-only $(git rev-list --max-parents=0 HEAD) HEAD)
          else
            CHANGED=$(git diff --name-only "${PREV_TAG}" HEAD)
          fi
          echo "$CHANGED"
          if echo "$CHANGED" | grep -q '^backend/'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$CHANGED" | grep -q '^frontend/'; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

  docker-backend:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: zackwag/caddy-ui-backend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-frontend:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: zackwag/caddy-ui-frontend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  dockerhub-docs:
    runs-on: ubuntu-latest
    needs: [changes, docker-backend, docker-frontend]
    if: always() && !failure() && !cancelled()
    steps:
      - uses: actions/checkout@v4

      - name: Update backend description
        if: needs.changes.outputs.backend == 'true'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: zackwag/caddy-ui-backend
          readme-filepath: ./backend/DOCKERHUB.md
          short-description: "API backend for caddy/ui — manages Caddy config, health checks, TLS, logs, and notifications"

      - name: Update frontend description
        if: needs.changes.outputs.frontend == 'true'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: zackwag/caddy-ui-frontend
          readme-filepath: ./frontend/DOCKERHUB.md
          short-description: "Web frontend for caddy/ui — manage your Caddy server from the browser"

  release:
    runs-on: ubuntu-latest
    needs: [changes, docker-backend, docker-frontend]
    if: always() && !failure() && !cancelled()
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: notes
        env:
          BACKEND: ${{ needs.changes.outputs.backend }}
          FRONTEND: ${{ needs.changes.outputs.frontend }}
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${{ github.ref_name }}$" | head -1)
          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s" HEAD)
          else
            COMMITS=$(git log --pretty=format:"- %s" "${PREV_TAG}..HEAD")
          fi

          IMAGES=""
          if [ "$BACKEND" = "true" ]; then
            IMAGES="${IMAGES}docker pull zackwag/caddy-ui-backend:${{ github.ref_name }}\n"
          fi
          if [ "$FRONTEND" = "true" ]; then
            IMAGES="${IMAGES}docker pull zackwag/caddy-ui-frontend:${{ github.ref_name }}\n"
          fi

          {
            echo 'NOTES<<EOF'
            echo "$COMMITS"
            echo 'EOF'
            echo 'IMAGES<<EOF'
            echo -e "$IMAGES"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: false
          body: |
            ### Features

            <!-- Edit these into your release-note style -->
            ${{ steps.notes.outputs.NOTES }}

            ---

            ### Docker images

            ```
            ${{ steps.notes.outputs.IMAGES }}
            ```
