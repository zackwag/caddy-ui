name: Publish hybrid images
on:
  push:
    tags: ['hybrid-v*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci && npm test && npm run lint
        working-directory: ${{ matrix.component }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/caddy-ui-${{ matrix.component }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/caddy-ui-${{ matrix.component }}:hybrid-latest
          build-args: APP_VERSION=${{ github.ref_name }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
