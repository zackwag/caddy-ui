name: Node 26 compatibility trial

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  compatibility:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The only explicit exception to the shared production runtime: this
      # manually requested compatibility run never changes the shipped images.
      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install locked application and tooling dependencies
        run: |
          npm ci --prefix src/backend
          npm ci --prefix src/frontend
          npm ci --prefix dev
          npm ci --prefix docs --ignore-scripts

      - name: Test backend
        run: npm test --prefix src/backend

      - name: Test frontend
        run: npm test --prefix src/frontend

      - name: Lint applications and development tooling
        run: |
          npm run lint --prefix src/backend
          npm run lint --prefix src/frontend -- --max-warnings=0
          npm run lint:dev-caddy

      - name: Test workflow, lifecycle and playground contracts
        run: |
          npm run test:workflows
          npm run test:dev-caddy
          npm run test:playground
          npm test --prefix docs

      - name: Build frontend
        run: npm run build --prefix src/frontend

      - name: Prepare real Caddy and Chromium
        run: |
          docker info
          docker pull "$(node -e "import('./dev/dev-caddy/harness.mjs').then(m => process.stdout.write(m.IMAGE))")"
          npm exec --prefix dev -- playwright install --with-deps chromium

      - name: Test real Caddy integration
        run: npm run test:dev-caddy:integration

      - name: Test authenticated documentation capture
        run: npm run test:screenshots --prefix docs

      - name: Test browser scenarios
        run: npm run test:dev-caddy:e2e

      - name: Render documentation assets
        run: |
          npm run docs:screenshots
          npm run i18n:coverage --prefix src/frontend

      - name: Install mdBook
        env:
          MDBOOK_VERSION: '0.5.4'
          MDBOOK_SHA256: '3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7'
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            --output "$RUNNER_TEMP/mdbook.tar.gz"
          echo "$MDBOOK_SHA256  $RUNNER_TEMP/mdbook.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/mdbook-bin"
          tar -xzf "$RUNNER_TEMP/mdbook.tar.gz" -C "$RUNNER_TEMP/mdbook-bin"
          echo "$RUNNER_TEMP/mdbook-bin" >> "$GITHUB_PATH"

      - name: Build documentation
        run: mdbook build docs

      - name: Prepare temporary Node 26 Dockerfiles
        run: |
          node --input-type=module <<'JS'
          import { mkdirSync, readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const production = readFileSync('.node-version', 'utf8').trim();
          const output = join(process.env.RUNNER_TEMP, 'node26-dockerfiles');
          mkdirSync(output, { recursive: true });
          for (const component of ['backend', 'frontend']) {
              const source = readFileSync(`src/${component}/Dockerfile`, 'utf8');
              const pattern = new RegExp(`^FROM node:${production}(?=[.\\s-]|$)`, 'gm');
              if (!pattern.test(source)) {
                  throw new Error(`No production Node stage found in ${component}`);
              }
              writeFileSync(join(output, `${component}.Dockerfile`), source.replace(pattern, 'FROM node:26'));
          }
          JS

      - name: Build both Alpine images locally without publishing
        run: |
          docker build --pull --progress=plain \
            -f "$RUNNER_TEMP/node26-dockerfiles/backend.Dockerfile" \
            -t caddy-ui-backend:node26-trial src/backend
          docker run --rm --entrypoint node caddy-ui-backend:node26-trial \
            -e "if (process.versions.node.split('.')[0] !== '26') process.exit(1)"
          docker build --pull --progress=plain \
            -f "$RUNNER_TEMP/node26-dockerfiles/frontend.Dockerfile" \
            -t caddy-ui-frontend:node26-trial src/frontend
