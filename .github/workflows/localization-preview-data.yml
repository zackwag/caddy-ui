name: Localization preview data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/backend/src/**'
      - 'src/backend/package*.json'
      - 'dev/playground/capture*'
      - 'dev/package.json'
      - 'dev/dev-caddy/harness.mjs'
      - 'dev/integration/stack.mjs'
      - 'dev/integration/lifecycle.mjs'
      - '.github/workflows/localization-preview-data.yml'

permissions:
  contents: read

jobs:
  capture:
    name: Capture real Caddy states
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: src/backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci --prefix src/backend
      - name: Prepare disposable Caddy
        run: |
          docker info
          docker pull "$(node -e "import('./dev/dev-caddy/harness.mjs').then(m => process.stdout.write(m.IMAGE))")"
      - name: Capture real responses and clean up
        run: npm run i18n:preview:capture
      - name: Publish reviewable capture
        uses: actions/upload-artifact@v7
        with:
          name: localization-preview-${{ github.sha }}
          path: dev/playground/captures/dashboard.json
          if-no-files-found: error
          retention-days: 30
