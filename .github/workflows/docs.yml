name: Documentation

on:
  pull_request:
  push:
    branches: [main]
  workflow_run:
    workflows: [Release]
    types: [completed]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      retry_failed:
        description: Retry unavailable historical books (successful snapshots stay unchanged)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'published' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build mdBook
    # workflow_run always checks out trusted main, never the triggering run's
    # code or artifacts. Release completion refreshes independent image records.
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.conclusion != 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install mdBook
        env:
          MDBOOK_VERSION: '0.5.4'
          MDBOOK_SHA256: '3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7'
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            --output "$RUNNER_TEMP/mdbook.tar.gz"
          echo "$MDBOOK_SHA256  $RUNNER_TEMP/mdbook.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/mdbook-bin"
          tar -xzf "$RUNNER_TEMP/mdbook.tar.gz" -C "$RUNNER_TEMP/mdbook-bin"
          echo "$RUNNER_TEMP/mdbook-bin" >> "$GITHUB_PATH"

      - name: Install documentation dependencies
        run: npm ci --prefix docs --ignore-scripts

      - name: Install frontend dependencies
        run: npm ci --prefix src/frontend

      - name: Install development tooling dependencies
        run: npm ci --prefix dev

      - name: Build frontend
        run: npm run build --prefix src/frontend

      - name: Install Chromium
        run: npm exec --prefix dev -- playwright install --with-deps chromium

      - name: Discover released documentation and image publications
        id: inventory
        env:
          INVENTORY_FILE: ${{ runner.temp }}/documentation-releases.json
        run: |
          git fetch https://github.com/zackwag/caddy-ui.git --tags refs/heads/main:refs/remotes/upstream/main refs/heads/versions:refs/remotes/upstream/versions
          node docs/scripts/history-inventory.mjs --to refs/remotes/upstream/main --output "$INVENTORY_FILE"
          node --input-type=module <<'JS'
          import { createHash } from 'node:crypto';
          import { readFileSync, appendFileSync } from 'node:fs';
          const { releases } = JSON.parse(readFileSync(process.env.INVENTORY_FILE, 'utf8'));
          const fingerprint = createHash('sha256').update(JSON.stringify(releases)).digest('hex');
          appendFileSync(process.env.GITHUB_OUTPUT, `fingerprint=${fingerprint}\n`);
          JS

      - name: Restore verified release books
        id: archive
        uses: actions/cache/restore@v5
        with:
          path: .docs-history
          key: documentation-history-v1-${{ runner.os }}-${{ steps.inventory.outputs.fingerprint }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            documentation-history-v1-${{ runner.os }}-${{ steps.inventory.outputs.fingerprint }}-
            documentation-history-v1-${{ runner.os }}-

      - name: Crawl new releases
        env:
          INVENTORY_FILE: ${{ runner.temp }}/documentation-releases.json
          RETRY_FAILED: ${{ inputs.retry_failed || false }}
        run: node docs/scripts/history-crawl.mjs --inventory "$INVENTORY_FILE" --retry-failed "$RETRY_FAILED"

      # Do not create another large cache for development-only pushes. A fresh
      # generation after a manual retry becomes the next restored archive.
      - name: Preserve the updated release archive
        if: steps.archive.outputs.cache-matched-key == '' || !startsWith(steps.archive.outputs.cache-matched-key, format('documentation-history-v1-{0}-{1}-', runner.os, steps.inventory.outputs.fingerprint)) || inputs.retry_failed
        uses: actions/cache/save@v5
        with:
          path: .docs-history
          key: ${{ steps.archive.outputs.cache-primary-key }}

      - name: Generate screenshots
        run: npm run docs:screenshots

      - name: Generate localization coverage
        run: node src/frontend/scripts/localization.mjs coverage

      - name: Test documentation tooling
        run: npm test --prefix docs

      - name: Build documentation
        run: |
          MDBOOK_OUTPUT__HTML__SITE_URL=/ mdbook build docs
          case "${GITHUB_REPOSITORY#*/}" in
            *.github.io) DOCS_BASE=/ ;;
            *) DOCS_BASE="/${GITHUB_REPOSITORY#*/}/" ;;
          esac
          echo "DOCS_BASE=$DOCS_BASE" >> "$GITHUB_ENV"
          node docs/scripts/history-site.mjs --base "$DOCS_BASE"

      - name: Check versioned documentation in Chromium
        run: npm run test:history:browser --prefix docs -- --site "$PWD/.docs-site" --base "$DOCS_BASE"

      - name: Validate unchanged Docker Hub routing
        run: |
          node --test .github/scripts/dockerhub-docs.test.mjs
          node .github/scripts/dockerhub-docs.mjs --dry-run

      - name: Upload documentation preview
        uses: actions/upload-artifact@v7
        with:
          name: documentation-preview
          path: .docs-site
          include-hidden-files: true

      - name: Retain crawl diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: documentation-history-report
          include-hidden-files: true
          path: |
            .docs-history/backfill.json
            .docs-history/report.md
            .docs-history/groups.json
            .docs-history/logs

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: .docs-site

  deploy:
    name: Deploy documentation
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
