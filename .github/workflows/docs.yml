name: Documentation

on:
  pull_request:
  push:
    branches: [main]
  workflow_run:
    workflows: [Release]
    types: [completed]
  # Upstream catch-up uses the same collect-then-publish path, never a timed race.
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      collect_history:
        description: Collect release books in the archive fork before publishing (upstream only)
        type: boolean
        default: false
      archive_history:
        description: Archive books in the fork only, without building or deploying Pages
        type: boolean
        default: false
      bootstrap:
        description: Allow creation of the initial historical archive
        type: boolean
        default: false
      retry_failed:
        description: Retry unavailable historical books (successful snapshots stay unchanged)
        type: boolean
        default: false

# The fork collects and stores release books. The upstream publisher requests
# collection after a release and waits for that exact run before restoring them.
env:
  DOCUMENTATION_ARCHIVE_REPOSITORY: ${{ vars.DOCS_ARCHIVE_REPOSITORY || 'juscghwe/caddy-ui' }}

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}-${{ inputs.archive_history && 'archive' || 'site' }}
  # Preserve pending release/manual requests when more pushes arrive.
  queue: max
  cancel-in-progress: false

jobs:
  archive:
    if: github.repository == 'juscghwe/caddy-ui' && github.event_name == 'workflow_dispatch' && inputs.archive_history
    permissions:
      contents: write
    uses: juscghwe/caddy-ui/.github/workflows/documentation-history.yml@bafb0788a3d14cd4fef1e61971061307ca8b1e61
    with:
      tooling_ref: bafb0788a3d14cd4fef1e61971061307ca8b1e61
      bootstrap: ${{ inputs.bootstrap || false }}
      retry_failed: ${{ inputs.retry_failed || false }}

  collect:
    name: Collect release books in the archive fork
    if: >-
      github.repository == 'zackwag/caddy-ui' && github.ref == 'refs/heads/main' && !inputs.archive_history &&
      (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.collect_history) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Check out trusted main
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Request collection and wait for the matching fork run
        env:
          # Fine-grained token: Actions write on the archive fork only. It is
          # never passed to historical renderers or the publishing job.
          GH_TOKEN: ${{ secrets.DOCS_ARCHIVE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo '::error::Configure DOCS_ARCHIVE_DISPATCH_TOKEN with Actions write on the archive fork.'
            exit 1
          fi
          node docs/scripts/history-collect.mjs --repository "$DOCUMENTATION_ARCHIVE_REPOSITORY"

  build:
    name: Build mdBook
    needs: [archive, collect]
    # Skipped collection permits ordinary previews/development updates, but a
    # failed or cancelled collection must never publish an older archive.
    if: >-
      !cancelled() && !inputs.archive_history &&
      (needs.archive.result == 'success' || needs.archive.result == 'skipped') &&
      (needs.collect.result == 'success' || needs.collect.result == 'skipped') &&
      (github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.repository == 'zackwag/caddy-ui') ||
      (github.event_name == 'workflow_run' && !github.event.repository.fork &&
      github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install mdBook
        env:
          MDBOOK_VERSION: '0.5.4'
          MDBOOK_SHA256: '3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7'
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            --output "$RUNNER_TEMP/mdbook.tar.gz"
          echo "$MDBOOK_SHA256  $RUNNER_TEMP/mdbook.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/mdbook-bin"
          tar -xzf "$RUNNER_TEMP/mdbook.tar.gz" -C "$RUNNER_TEMP/mdbook-bin"
          echo "$RUNNER_TEMP/mdbook-bin" >> "$GITHUB_PATH"

      - name: Install documentation dependencies
        run: npm ci --prefix docs --ignore-scripts

      - name: Install frontend dependencies
        run: npm ci --prefix src/frontend

      - name: Install development tooling dependencies
        run: npm ci --prefix dev

      - name: Build frontend
        run: npm run build --prefix src/frontend

      - name: Install Chromium
        run: npm exec --prefix dev -- playwright install --with-deps chromium

      - name: Restore preserved release books
        env:
          GH_TOKEN: ${{ github.token }}
        run: node docs/scripts/history-archive.mjs restore --repository "$DOCUMENTATION_ARCHIVE_REPOSITORY"

      - name: Discover released documentation and image publications
        env:
          INVENTORY_FILE: ${{ runner.temp }}/documentation-releases.json
        run: |
          git fetch https://github.com/zackwag/caddy-ui.git --tags refs/heads/main:refs/remotes/upstream/main refs/heads/versions:refs/remotes/upstream/versions
          node docs/scripts/history-inventory.mjs --to refs/remotes/upstream/main --output "$INVENTORY_FILE"

      - name: Generate screenshots
        run: npm run docs:screenshots

      - name: Generate localization coverage
        run: node src/frontend/scripts/localization.mjs coverage

      - name: Test documentation tooling
        run: npm test --prefix docs

      - name: Build documentation
        env:
          REQUIRE_COLLECTED: ${{ needs.collect.result == 'success' && 'true' || 'false' }}
        run: |
          MDBOOK_OUTPUT__HTML__SITE_URL=/ mdbook build docs
          case "${GITHUB_REPOSITORY#*/}" in
            *.github.io) DOCS_BASE=/ ;;
            *) DOCS_BASE="/${GITHUB_REPOSITORY#*/}/" ;;
          esac
          echo "DOCS_BASE=$DOCS_BASE" >> "$GITHUB_ENV"
          node docs/scripts/history-site.mjs --base "$DOCS_BASE" --inventory "$RUNNER_TEMP/documentation-releases.json" --require-collected "$REQUIRE_COLLECTED"

      - name: Check versioned documentation in Chromium
        run: npm run test:history:browser --prefix docs -- --site "$PWD/.docs-site" --base "$DOCS_BASE"

      - name: Validate unchanged Docker Hub routing
        run: |
          node --test .github/scripts/dockerhub-docs.test.mjs
          node .github/scripts/dockerhub-docs.mjs --dry-run

      - name: Upload documentation preview
        uses: actions/upload-artifact@v7
        with:
          name: documentation-preview
          path: .docs-site
          include-hidden-files: true

      - name: Retain crawl diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: documentation-history-report
          include-hidden-files: true
          path: |
            .docs-history/backfill.json
            .docs-history/report.md
            .docs-history/groups.json
            .docs-history/logs

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !github.event.repository.fork
        uses: actions/upload-pages-artifact@v5
        with:
          path: .docs-site

  deploy:
    name: Deploy documentation
    if: ${{ !cancelled() && needs.build.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !github.event.repository.fork && !inputs.archive_history }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
