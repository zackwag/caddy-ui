name: Test

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test (${{ matrix.project }})
    strategy:
      fail-fast: false
      matrix:
        project: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint development harness
        if: matrix.project == 'backend'
        run: npm run lint:dev-caddy --prefix ..

      - name: Test development lifecycle safety
        if: matrix.project == 'backend'
        run: npm run test:dev-caddy --prefix ..

      - name: Run tests
        run: npm test

  test-required:
    name: Test
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Verify test matrix
        run: |
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "Test matrix did not complete successfully: ${{ needs.test.result }}"
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    name: Lint (${{ matrix.project }})
    strategy:
      fail-fast: false
      matrix:
        project: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: ${{ matrix.project == 'frontend' && 'npm run lint -- --max-warnings=0' || 'npm run lint' }}

