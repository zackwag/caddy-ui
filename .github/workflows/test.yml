name: Test

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test (${{ matrix.project }})
    strategy:
      fail-fast: false
      matrix:
        project: [backend, frontend]
    defaults:
      run:
        working-directory: src/${{ matrix.project }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            src/${{ matrix.project }}/package-lock.json
            dev/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  integration:
    runs-on: ubuntu-latest
    name: Real Caddy integration
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            src/backend/package-lock.json
            src/frontend/package-lock.json
            dev/package-lock.json

      - name: Install application and test dependencies
        run: |
          npm ci --prefix src/backend
          npm ci --prefix src/frontend
          npm ci --prefix dev

      - name: Lint development tooling
        run: npm run lint:dev-caddy

      - name: Test playground tooling
        run: npm run test:playground

      - name: Test development lifecycle safety
        run: npm run test:dev-caddy

      - name: Prepare real Caddy and Chromium
        run: |
          docker info
          docker pull "$(node -e "import('./dev/dev-caddy/harness.mjs').then(m => process.stdout.write(m.IMAGE))")"
          npm exec --prefix dev -- playwright install --with-deps chromium

      - name: Test lifecycle, registration and instance isolation
        run: npm run test:dev-caddy:integration

      - name: Test authenticated documentation capture and replay
        run: npm run test:screenshots --prefix docs

      - name: Test error handling and live logs in Chromium
        run: npm run test:dev-caddy:e2e

  test-required:
    name: Test
    runs-on: ubuntu-latest
    needs: [test, integration]
    if: always()
    steps:
      - name: Verify test matrix
        run: |
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "Test matrix did not complete successfully: ${{ needs.test.result }}"
            exit 1
          fi
          if [[ "${{ needs.integration.result }}" != "success" ]]; then
            echo "Real Caddy integration did not complete successfully: ${{ needs.integration.result }}"
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    name: Lint (${{ matrix.project }})
    strategy:
      fail-fast: false
      matrix:
        project: [backend, frontend]
    defaults:
      run:
        working-directory: src/${{ matrix.project }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: ${{ matrix.project == 'frontend' && 'npm run lint -- --max-warnings=0' || 'npm run lint' }}

