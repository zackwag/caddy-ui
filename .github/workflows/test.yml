name: Test

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      diagnostic_operation:
        description: Collect trials or publish an existing diagnostic artifact
        type: choice
        options: [collect, publish]
        default: collect
      diagnostic_run:
        description: Completed diagnostic run ID to publish (publish only)
        type: string
      diagnostic_attempt:
        description: Source run attempt to publish (publish only)
        type: string
        default: '1'
      diagnostic_trials:
        description: Trials per profile on dev/etoe-diagnostics (1–20)
        type: choice
        options: ['1', '3', '5', '10', '20']
        default: '3'
      diagnostic_seed:
        description: Diagnostic profile-order seed
        type: string
        default: '12345'
      diagnostic_profiles:
        description: Diagnostic profile selection
        type: choice
        options: [all, normal, slow-style, settled-network, localhost]
        default: all
      diagnostic_scope:
        description: Normal profile runs the whole suite or just recovery
        type: choice
        options: [suite, recovery]
        default: suite

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev/etoe-diagnostics' && format('etoe-diagnostics-{0}-{1}', github.run_id, github.run_attempt) || format('test-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/dev/etoe-diagnostics' }}

permissions: {}

jobs:
  test:
    if: github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/dev/etoe-diagnostics'
    runs-on: ubuntu-latest
    name: Test (${{ matrix.project }})
    strategy:
      fail-fast: false
      matrix:
        project: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint development harness
        if: matrix.project == 'backend'
        run: npm run lint:dev-caddy --prefix ..

      - name: Test development lifecycle safety
        if: matrix.project == 'backend'
        run: npm run test:dev-caddy --prefix ..

      - name: Run tests
        run: npm test

  integration:
    if: github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/dev/etoe-diagnostics'
    runs-on: ubuntu-latest
    name: Real Caddy integration
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install application and test dependencies
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend

      - name: Prepare real Caddy and Chromium
        run: |
          docker info
          docker pull "$(node -e "import('./scripts/dev-caddy/harness.mjs').then(m => process.stdout.write(m.IMAGE))")"
          npm exec --prefix frontend -- playwright install --with-deps chromium

      - name: Test lifecycle, registration and instance isolation
        run: npm run test:dev-caddy:integration

      - name: Test error handling and live logs in Chromium
        run: npm run test:dev-caddy:e2e

  test-required:
    name: Test
    runs-on: ubuntu-latest
    needs: [test, integration]
    if: always() && (github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/dev/etoe-diagnostics')
    steps:
      - name: Verify test matrix
        run: |
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "Test matrix did not complete successfully: ${{ needs.test.result }}"
            exit 1
          fi
          if [[ "${{ needs.integration.result }}" != "success" ]]; then
            echo "Real Caddy integration did not complete successfully: ${{ needs.integration.result }}"
            exit 1
          fi

  lint:
    if: github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/dev/etoe-diagnostics'
    runs-on: ubuntu-latest
    name: Lint (${{ matrix.project }})
    strategy:
      fail-fast: false
      matrix:
        project: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: ${{ matrix.project == 'frontend' && 'npm run lint -- --max-warnings=0' || 'npm run lint' }}

  etoe-diagnostics:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev/etoe-diagnostics' && inputs.diagnostic_operation != 'publish'
    permissions:
      contents: read
    uses: ./.github/workflows/etoe-diagnostics.yml
    with:
      trials: ${{ inputs.diagnostic_trials || '3' }}
      seed: ${{ inputs.diagnostic_seed || '12345' }}
      profiles: ${{ inputs.diagnostic_profiles || 'all' }}
      scope: ${{ inputs.diagnostic_scope || 'suite' }}

  publish-diagnostics:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev/etoe-diagnostics' && inputs.diagnostic_operation == 'publish'
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/publish-etoe-diagnostics.yml
    with:
      run: ${{ inputs.diagnostic_run }}
      attempt: ${{ inputs.diagnostic_attempt || '1' }}

