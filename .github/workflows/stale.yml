name: Stale Issues

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not had
            activity in 14 days. It will be closed in 7 days if no further activity occurs.
            If this is still relevant, please leave a comment.
          close-issue-message: >
            Closed due to inactivity. Feel free to reopen if this is still relevant.
          days-before-stale: 14
          days-before-close: 7
          stale-issue-label: stale
          exempt-issue-labels: pinned,enhancement,bug
          operations-per-run: 30
