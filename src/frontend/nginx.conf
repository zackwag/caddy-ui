server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Compress text responses. gzip_proxied covers requests that arrive through
    # a reverse proxy such as Caddy, which nginx otherwise sends uncompressed.
    # text/event-stream stays out so the live log stream isn't buffered.
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    # Proxy API requests to the backend
    location /api/ {
        proxy_pass http://caddy-ui-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Vite content-hashes these filenames, so they never change in place.
    # Missing assets 404 instead of falling back to index.html.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback -- serve index.html for all non-file routes. no-cache makes
    # browsers revalidate it, so a new deploy's asset names load right away.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
