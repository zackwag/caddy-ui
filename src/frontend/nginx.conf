server {
    listen 80;
    # Populated at container startup; empty trust leaves direct clients intact.
    include /etc/nginx/trusted-upstreams/*.conf;
    root /usr/share/nginx/html;
    index index.html;

    # Compress text responses. gzip_proxied covers requests that arrive through
    # a reverse proxy such as Caddy, which nginx otherwise sends uncompressed.
    # text/event-stream stays out so the live log stream isn't buffered.
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    # Proxy API requests to the backend
    location /api/ {
        proxy_pass http://caddy-ui-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        # Replace untrusted forwarding input, rather than appending to it.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }

    # Vite content-hashes these filenames, so they never change in place.
    # Missing assets 404 instead of falling back to index.html.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback -- serve index.html for all non-file routes. no-cache makes
    # browsers revalidate it, so a new deploy's asset names load right away.
    location / {
        # Policy belongs on the HTML response; putting it at server scope would
        # lose it to this location's Cache-Control add_header. React/CodeMirror
        # need inline styles, but scripts never need inline code or eval.
        # No upgrade-insecure-requests: plain HTTP deployments remain supported.
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; script-src-attr 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'none'; object-src 'none'; frame-src 'none'; frame-ancestors 'self'; form-action 'self'" always;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
